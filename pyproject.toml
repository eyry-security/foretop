[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foretop"
version = "0.1.0"
description = "Pluggable live feed of new hosts for your scope. The lookout of the Eyry recon suite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Eyry", email = "hello@eyry.io" }]
keywords = ["recon", "certstream", "ct-logs", "bugbounty", "attack-surface", "osint"]
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://eyry.io"
Repository = "https://github.com/eyry-security/foretop"

[project.scripts]
foretop = "foretop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foretop*"]
